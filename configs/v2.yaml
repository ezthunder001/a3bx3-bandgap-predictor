# v2 pipeline configuration. Every number that shapes a result lives here.
# Changing a value here changes reports/metrics_v2.json; the determinism test
# compares a fresh run against the committed file, so commit both together.

version: v2.0-dev
seed: 42

data:
  raw_dir: data/raw
  literature_dir: data/raw/literature
  manifest: data/raw/MANIFEST.sha256
  # Trainable label functionals. The target is the GGA-PBE gap.
  # include_soc = true also admits rows labelled "PBE+SOC" (default off: SOC
  # shifts Bi/Sb gaps strongly, so mixing it silently would be label noise).
  target_functional: PBE
  include_soc: false
  # Conflict rule: when two sources give the same formula gaps that differ by
  # more than this, both rows are logged and one is picked by the rule in curate.py.
  conflict_threshold_eV: 0.2
  # Locked final holdout. Absent from every training fold (tests enforce it).
  holdout_formulas: [Sr3BiI3, Sr3BiBr3, Sr3BiCl3]
  # Known provenance defects, reported by tests rather than silently passing.
  # A row whose 'doi' is not a resolvable DOI string. Do NOT invent DOIs to clear this.
  known_doi_issues:
    - {formula: Ca3BiI3, doi: "NJC 2026,50,522 Islam", issue: citation string, no DOI recorded}
    - {formula: Ca3BiBr3, doi: "NJC 2026,50,522 Islam", issue: citation string, no DOI recorded}
    - {formula: Ca3BiCl3, doi: "NJC 2026,50,522 Islam", issue: citation string, no DOI recorded}
    - {formula: Sr3BiI3, doi: "NJC 2026,50,522 Islam", issue: citation string, no DOI recorded}
    - {formula: Sr3BiBr3, doi: "NJC 2026,50,522 Islam", issue: citation string, no DOI recorded}
    - {formula: Sr3BiCl3, doi: "NJC 2026,50,522 Islam", issue: citation string, no DOI recorded}
    - {formula: Ca3AsCl3, doi: "10.1016/j.mtcomm.2024", issue: truncated Elsevier DOI (journal + year only)}
  mp:
    # Filled from the fetch run (MPRester.get_database_version()); null = never fetched.
    db_version: null
    anonymous_formula: AB3C3          # MP sorts anonymous formulas by count: A3BX3 -> AB3C3
    pnictogens: [N, P, As, Sb, Bi]
    halogens: [F, Cl, Br, I]
  jarvis:
    dataset: dft_3d                   # jarvis-tools figshare dataset name
  oqmd:
    endpoint: https://oqmd.org/optimade/v1/structures

features:
  sets: [physics9, magpie]

splits:
  # Reported in this order (design section 5).
  lobo: {group: B}                    # leave-one-B-family-out (headline)
  loao: {group: A}                    # leave-one-A-out
  gkf:  {n_splits: 5, n_repeats: 10}  # repeated GroupKFold by formula, shuffled group order
  loo:  {group: formula}              # comparison with v1 only
  inner: {n_splits: 5}                # inner GroupKFold for nested hyperparameter search

models:
  ridge_alphas_logspace: {start: -3, stop: 3, num: 13}   # identical to v1 RidgeCV grid
  ridge_magpie_grid:
    select__k: [5, 15, 40]
    ridge__alpha: [0.1, 1.0, 10.0, 100.0]
  gpr:
    n_restarts_optimizer: 8
    random_state: 42
  rf:
    n_estimators: 300
    grid:
      rf__max_features: [0.33, 1.0]
      rf__min_samples_leaf: [1, 3]
  xgb:
    fixed: {learning_rate: 0.05, reg_lambda: 5.0, subsample: 0.8, colsample_bytree: 0.8, n_jobs: 1}
    grid:
      xgb__max_depth: [2, 3]
      xgb__n_estimators: [100, 300]

evaluate:
  bootstrap_n: 2000
  ci: 0.95
  headline_model: gpr_physics9
  headline_split: lobo
