[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a3bx3"
version = "2.0.0.dev0"
description = "PBE band gaps of A3BX3 inverse-perovskite pnictogen halides: small data, honest validation"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: reruns the full offline pipeline (minutes)"]
